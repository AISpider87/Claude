project_id = "superlega"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed/*.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"

# token_hash links work from any browser/app (unlike the PKCE ?code= flow, which
# needs the same browser that started the signup: a problem on iPhone/PWA).
# On hosted Supabase paste the same templates in Auth > Email Templates (docs/DEPLOY.md).
[auth.email.template.confirmation]
subject = "Conferma il tuo account SuperLega"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reimposta la password di SuperLega"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Conferma il cambio email di SuperLega"
content_path = "./supabase/templates/email_change.html"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[local_smtp]
enabled = true
port = 54324
