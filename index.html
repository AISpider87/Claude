<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battitore d'Asta</title>
<style>
  :root{
    --oro:#d9a441;
    --oro-chiaro:#f6d67e;
    --oro-scuro:#8a5f18;
    --rosso:#c0392b;
    --verde:#1e6f4c;
    --fondo:#14100c;
    --legno:#3a2416;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(ellipse at 50% 8%, #4a3220 0%, #241608 45%, var(--fondo) 100%);
    color:#f3e6cf;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  /* texture legno leggera */
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(96deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px);
    mix-blend-mode:overlay;
  }

  header{text-align:center;margin-bottom:18px;}
  h1{
    font-size:clamp(22px,3.4vw,38px);
    letter-spacing:.22em;
    text-transform:uppercase;
    font-weight:700;
    background:linear-gradient(180deg,var(--oro-chiaro),var(--oro),var(--oro-scuro));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 18px rgba(217,164,65,.18);
  }
  .sottotitolo{
    margin-top:8px;font-size:13px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(243,230,207,.42);
  }

  /* ---------- DISPLAY ---------- */
  .scena{
    position:relative;
    width:min(70vh,460px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
  }
  svg.anello{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  .traccia{fill:none;stroke:rgba(255,255,255,.07);stroke-width:8;}
  .progresso{
    fill:none;stroke:url(#gradOro);stroke-width:8;stroke-linecap:round;
    filter:drop-shadow(0 0 10px rgba(217,164,65,.55));
    transition:stroke .3s ease;
  }
  .scena.finale .progresso{stroke:url(#gradRosso);filter:drop-shadow(0 0 16px rgba(192,57,43,.7));}
  .scena.aggiudicato .progresso{stroke:url(#gradVerde);filter:drop-shadow(0 0 16px rgba(30,111,76,.7));}

  /* ---------- PULSANTE ---------- */
  .martelletto{
    position:relative;
    width:64%;aspect-ratio:1;border-radius:50%;
    border:none;cursor:pointer;
    background:
      radial-gradient(circle at 34% 26%, #ffe9b0 0%, var(--oro-chiaro) 16%, var(--oro) 46%, #a9761f 74%, #5e3f0d 100%);
    box-shadow:
      inset 0 3px 10px rgba(255,255,255,.55),
      inset 0 -12px 26px rgba(0,0,0,.45),
      0 22px 46px rgba(0,0,0,.6),
      0 0 0 10px rgba(217,164,65,.08),
      0 0 60px rgba(217,164,65,.22);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, filter .3s ease;
    outline:none;
  }
  .martelletto:hover{transform:translateY(-3px) scale(1.02);}
  .martelletto:active{transform:translateY(4px) scale(.97);
    box-shadow:inset 0 3px 10px rgba(255,255,255,.35),inset 0 -6px 18px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.6);}
  .martelletto:disabled{cursor:default;filter:saturate(.55) brightness(.72);transform:none;}
  .martelletto svg.gavel{width:40%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));}
  .etichetta-btn{
    font-size:clamp(11px,1.3vw,15px);letter-spacing:.3em;text-transform:uppercase;
    font-weight:800;color:#4a3208;text-shadow:0 1px 0 rgba(255,255,255,.4);
  }

  /* ---------- CONTATORE ---------- */
  .contatore{
    position:absolute;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;
    pointer-events:none;
  }
  .attivo .contatore{display:flex;}
  .attivo .martelletto{opacity:0;pointer-events:none;}
  .numero{
    font-size:min(30vh,190px);line-height:.92;font-weight:800;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff6de,var(--oro),var(--oro-scuro));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(217,164,65,.25);
  }
  .scena.finale .numero{background:linear-gradient(180deg,#ffd7cf,#e4533f,#7d2015);-webkit-background-clip:text;background-clip:text;}
  .fase{
    font-size:clamp(12px,1.5vw,17px);letter-spacing:.34em;text-transform:uppercase;
    color:rgba(243,230,207,.6);
  }
  .cronometro{
    font-size:14px;letter-spacing:.12em;color:rgba(243,230,207,.34);
    font-variant-numeric:tabular-nums;
  }
  .esito{
    display:none;text-align:center;max-width:90%;
  }
  .aggiudicato .esito{pointer-events:auto;cursor:pointer;}
  .aggiudicato .esito{display:block;}
  .aggiudicato .numero,.aggiudicato .fase,.aggiudicato .cronometro{display:none;}
  .esito .parola{
    font-size:clamp(18px,3vw,40px);font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding-right:.12em;white-space:nowrap;
    background:linear-gradient(180deg,#d8ffe9,#4fd18f,#12603f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:timbro .5s cubic-bezier(.2,1.6,.4,1);
  }
  .esito .nota{margin-top:10px;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:rgba(243,230,207,.45);}
  @keyframes timbro{from{transform:scale(2.4);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* pulsazione ad ogni colpo */
  @keyframes colpo{
    0%{transform:scale(1);}
    35%{transform:scale(1.14);}
    100%{transform:scale(1);}
  }
  .batti .numero{animation:colpo .42s ease-out;}
  @keyframes lampo{0%{opacity:.55;}100%{opacity:0;}}
  .flash{
    position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,#fff 0%,transparent 65%);
    animation:lampo .32s ease-out forwards;
  }
  .flash.rosso{background:radial-gradient(circle,#ff6a4d 0%,transparent 65%);}

  /* ---------- PIEDE ---------- */
  footer{
    margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .tappe{display:flex;gap:10px;}
  .tappa{
    display:flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    padding:8px 14px;border-radius:999px;
    border:1px solid rgba(217,164,65,.22);
    background:rgba(255,255,255,.03);
    color:rgba(243,230,207,.4);
    transition:all .25s ease;
  }
  .tappa.on{
    border-color:rgba(217,164,65,.85);color:#f6d67e;
    background:rgba(217,164,65,.14);
    box-shadow:0 0 18px rgba(217,164,65,.28);
  }
  .tappa.on.ultima{border-color:rgba(192,57,43,.9);color:#ff9a86;background:rgba(192,57,43,.16);box-shadow:0 0 18px rgba(192,57,43,.35);}
  .pallino{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .azioni{display:flex;gap:12px;align-items:center;}
  .mini{
    background:rgba(255,255,255,.05);border:1px solid rgba(243,230,207,.16);
    color:rgba(243,230,207,.72);padding:9px 18px;border-radius:999px;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
    transition:all .2s ease;
  }
  .mini:hover{background:rgba(255,255,255,.11);color:#f6d67e;border-color:rgba(217,164,65,.5);}
  .suggerimento{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,230,207,.26);}
</style>
</head>
<body>

<header>
  <h1>Battitore d'Asta</h1>
  <div class="sottotitolo">Aggiudicazione &middot; 5&nbsp;secondi + 3&nbsp;colpi</div>
</header>

<div class="scena" id="scena">
  <svg class="anello" viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <linearGradient id="gradOro" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f6d67e"/><stop offset="100%" stop-color="#b9822a"/>
      </linearGradient>
      <linearGradient id="gradRosso" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff8f76"/><stop offset="100%" stop-color="#a32718"/>
      </linearGradient>
      <linearGradient id="gradVerde" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#6ee7a8"/><stop offset="100%" stop-color="#12603f"/>
      </linearGradient>
    </defs>
    <circle class="traccia" cx="100" cy="100" r="92"/>
    <circle class="progresso" id="progresso" cx="100" cy="100" r="92"
            stroke-dasharray="578.05" stroke-dashoffset="578.05"/>
  </svg>

  <button class="martelletto" id="pulsante" aria-label="Avvia l'aggiudicazione">
    <svg class="gavel" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="#4a3208">
        <!-- martelletto: testa + manico, inclinato -->
        <g transform="rotate(-32 32 20)">
          <rect x="8"  y="10" width="22" height="20" rx="5"/>
          <rect x="28" y="17" width="28" height="6"  rx="3"/>
        </g>
        <!-- ceppo di battuta -->
        <rect x="14" y="42" width="36" height="6" rx="3"/>
        <rect x="6"  y="49" width="52" height="8" rx="4"/>
      </g>
    </svg>
    <span class="etichetta-btn">Batti</span>
  </button>

  <div class="contatore">
    <div class="numero" id="numero">0</div>
    <div class="fase" id="fase">In attesa</div>
    <div class="cronometro" id="cronometro">0.00 s</div>
    <div class="esito">
      <div class="parola">Aggiudicato</div>
      <div class="nota">Clic o spazio per ribattere</div>
    </div>
  </div>
</div>

<footer>
  <div class="tappe">
    <div class="tappa" id="t3"><span class="pallino"></span>1&deg; colpo &middot; 5s</div>
    <div class="tappa" id="t2"><span class="pallino"></span>2&deg; colpo &middot; 6s</div>
    <div class="tappa ultima" id="t1"><span class="pallino"></span>3&deg; colpo &middot; 8s</div>
  </div>
  <div class="azioni">
    <button class="mini" id="reset">Ripristina</button>
    <span class="suggerimento">Spazio = batti &middot; Esc = annulla</span>
  </div>
</footer>

<script>
"use strict";

/* ====== TEMPI (secondi dalla pressione) ======
   0 → 5   attesa silenziosa, i secondi scorrono a schermo
   5s      1º colpo  (conteggio "3")
   6s      2º colpo  (conteggio "2")
   8s      3º colpo  (conteggio "1") — ritardato di 2 secondi in più
*/
const ATTESA      = 5;
const COLPI       = [5, 6, 8];
const FINE        = COLPI[2] + 1.2;

const scena     = document.getElementById('scena');
const pulsante  = document.getElementById('pulsante');
const numero    = document.getElementById('numero');
const fase      = document.getElementById('fase');
const cronometro= document.getElementById('cronometro');
const progresso = document.getElementById('progresso');
const reset     = document.getElementById('reset');
const tappe     = [document.getElementById('t3'), document.getElementById('t2'), document.getElementById('t1')];
const CIRCONFERENZA = 2 * Math.PI * 92;

let ctx = null;          // AudioContext
let t0 = 0;              // istante di avvio (tempo audio)
let raf = 0;
let colpiFatti = 0;
let ultimoSecondo = -1;
let inCorso = false;

/* ---------- AUDIO: colpi di martelletto sintetizzati ---------- */
function audio(){
  if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(ctx.state === 'suspended') ctx.resume();
  return ctx;
}

// bus di uscita: compressore + volume generale, così il colpo finale
// resta pieno senza saturare
function uscita(){
  if(!ctx._bus){
    const g = ctx.createGain();
    g.gain.value = .62;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.knee.value = 8;
    comp.ratio.value = 6;
    comp.attack.value = .003;
    comp.release.value = .18;
    g.connect(comp).connect(ctx.destination);
    ctx._bus = g;
  }
  return ctx._bus;
}

// rumore breve = impatto del legno
function impatto(t, dur, vol){
  const n = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < n; i++){
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const filtro = ctx.createBiquadFilter();
  filtro.type = 'bandpass'; filtro.frequency.value = 1500; filtro.Q.value = .8;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(filtro).connect(g).connect(uscita());
  src.start(t); src.stop(t + dur);
}

// corpo tonale del colpo
function tono(t, freq, dur, vol, tipo){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = tipo || 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * .55, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .006);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(uscita());
  o.start(t); o.stop(t + dur + .05);
}

// colpo 1 e 2: secco e brillante — colpo 3: pieno, grave, risonante
function colpo(t, finale){
  if(finale){
    impatto(t, .30, .95);
    tono(t, 150, 1.10, .85, 'sine');     // tonfo profondo
    tono(t, 320, .70, .40, 'triangle');  // corpo
    tono(t + .004, 980, 1.60, .28, 'sine'); // risonanza lunga
    tono(t + .004, 1470, 1.20, .16, 'sine');
  } else {
    impatto(t, .13, .55);
    tono(t, 220, .34, .55, 'sine');
    tono(t + .003, 880, .42, .30, 'sine');
    tono(t + .003, 1320, .30, .14, 'sine');
  }
}

/* ---------- FLASH a schermo ---------- */
function flash(finale){
  const el = document.createElement('div');
  el.className = 'flash' + (finale ? ' rosso' : '');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 340);
}

function pulsa(){
  scena.classList.remove('batti');
  void scena.offsetWidth;      // forza il riavvio dell'animazione
  scena.classList.add('batti');
}

/* ---------- CICLO ---------- */
function avvia(){
  if(inCorso) return;
  const a = audio();
  inCorso = true;
  colpiFatti = 0;
  ultimoSecondo = -1;
  t0 = a.currentTime + .06;    // piccolo margine di sicurezza

  scena.classList.add('attivo');
  scena.classList.remove('finale', 'aggiudicato');
  tappe.forEach(t => t.classList.remove('on'));
  pulsante.disabled = true;

  // i tre colpi vengono programmati sul clock audio: precisione al campione
  COLPI.forEach((s, i) => colpo(t0 + s, i === 2));

  raf = requestAnimationFrame(disegna);
}

function disegna(){
  const t = Math.max(0, audio().currentTime - t0);

  cronometro.textContent = t.toFixed(2) + ' s';
  progresso.style.strokeDashoffset = CIRCONFERENZA * (1 - Math.min(t / COLPI[2], 1));

  if(t < ATTESA){
    // fase silenziosa: i secondi scorrono in avanti, 0 → 4
    const trascorsi = Math.floor(t);
    if(trascorsi !== ultimoSecondo){ ultimoSecondo = trascorsi; pulsa(); }
    numero.textContent = trascorsi;
    fase.textContent = 'Secondi trascorsi';
  } else if(t < COLPI[2]){
    scena.classList.add('finale');
    numero.textContent = (t < COLPI[1]) ? '3' : '2';
    fase.textContent = 'Ultimi secondi';
  } else {
    numero.textContent = '1';
    fase.textContent = 'Ultimi secondi';
  }

  // effetti visivi allineati ai colpi già programmati
  while(colpiFatti < 3 && t >= COLPI[colpiFatti]){
    const finale = (colpiFatti === 2);
    tappe[colpiFatti].classList.add('on');
    flash(finale);
    pulsa();
    colpiFatti++;
  }

  if(t >= FINE){
    scena.classList.add('aggiudicato');
    scena.classList.remove('finale');
    inCorso = false;
    pulsante.disabled = false;
    return;
  }
  raf = requestAnimationFrame(disegna);
}

function annulla(){
  cancelAnimationFrame(raf);
  inCorso = false;
  if(ctx){ ctx.close(); ctx = null; }   // ferma anche i colpi già programmati
  scena.classList.remove('attivo', 'finale', 'aggiudicato', 'batti');
  tappe.forEach(t => t.classList.remove('on'));
  progresso.style.strokeDashoffset = CIRCONFERENZA;
  numero.textContent = '0';
  cronometro.textContent = '0.00 s';
  fase.textContent = 'In attesa';
  pulsante.disabled = false;
}

pulsante.addEventListener('click', avvia);
document.querySelector('.esito').addEventListener('click', avvia);
reset.addEventListener('click', annulla);
document.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); avvia(); }
  if(e.code === 'Escape'){ annulla(); }
});
</script>
</body>
</html>
